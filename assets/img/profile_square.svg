<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <defs>
    <!-- Soft skin shading gradient -->
    <linearGradient id="skinGrad" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#f0d3c2"/>
      <stop offset="55%" stop-color="#e7c6b3"/>
      <stop offset="100%" stop-color="#dbb6a2"/>
    </linearGradient>

    <!-- Neck skin gradient -->
    <linearGradient id="neckGrad" x1="0.3" y1="0.0" x2="0.6" y2="1.0">
      <stop offset="0%" stop-color="#b9917c"/>
      <stop offset="40%" stop-color="#d7b29e"/>
      <stop offset="100%" stop-color="#e6c6b4"/>
    </linearGradient>

    <!-- Hair subtle sheen -->
    <linearGradient id="hairGrad" x1="0.2" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#222220"/>
      <stop offset="50%" stop-color="#191918"/>
      <stop offset="100%" stop-color="#131312"/>
    </linearGradient>

    <!-- Light blue-grey shirt / collar gradient -->
    <linearGradient id="shirtLightGrad" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#d6e0e6"/>
      <stop offset="50%" stop-color="#bac7cf"/>
      <stop offset="100%" stop-color="#9eacba"/>
    </linearGradient>

    <!-- Right shoulder highlight gradient -->
    <linearGradient id="rightShoulderGrad" x1="0.72" y1="0.02" x2="0.18" y2="0.98">
      <stop offset="0%" stop-color="#f2f6f8"/>
      <stop offset="30%" stop-color="#d4dfe6"/>
      <stop offset="70%" stop-color="#b5c4ce"/>
      <stop offset="100%" stop-color="#9caab6"/>
    </linearGradient>

    <!-- Left sleeve brown-grey gradient -->
    <linearGradient id="sleeveGrad" x1="0.2" y1="0.0" x2="0.8" y2="1.0">
      <stop offset="0%" stop-color="#756f61"/>
      <stop offset="52%" stop-color="#5f5a4e"/>
      <stop offset="100%" stop-color="#4d493f"/>
    </linearGradient>

    <!-- Inner dark shirt gradient -->
    <linearGradient id="innerShirtGrad" x1="0.5" y1="0.0" x2="0.5" y2="1.0">
      <stop offset="0%" stop-color="#5d5f5c"/>
      <stop offset="100%" stop-color="#454744"/>
    </linearGradient>

    <!-- Glasses lens subtle tint & reflection -->
    <linearGradient id="lensGrad" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.36"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e8eff2" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Subtle soft white outer rim halo -->
    <filter id="softRim" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- 1. BACKGROUND -->
  <rect x="0" y="0" width="1024" height="1024" fill="#a4ea1c"/>

  <!-- 2. SUBTLE WHITE OUTER HALO -->
  <g opacity="0.52" filter="url(#softRim)">
    <path d="M 218,485 C 194,385 198,285 245,236 C 306,170 400,138 470,140 C 550,136 618,162 636,184 C 698,220 744,268 756,335 C 756,380 748,430 756,466 C 792,492 802,535 782,580 C 765,612 758,645 752,684 C 738,735 705,775 662,794 C 722,812 775,868 852,1024 L 0,1024 L 0,890 C 52,824 128,782 218,738 C 234,705 268,690 306,684 L 304,658 C 242,652 204,606 204,544 C 204,515 210,498 218,485 Z"
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- 3. TORSO, SHOULDERS & CLOTHING -->
  <g id="torso">
    <!-- Right shoulder / outer shirt base -->
    <path d="M 594,790 C 668,790 734,820 778,882 C 804,920 826,972 848,1024 L 584,1024 Z"
          fill="url(#rightShoulderGrad)" stroke="#141414" stroke-width="12" stroke-linejoin="round"/>

    <!-- Subtle vertical shadow fold on right shoulder -->
    <path d="M 622,824 C 642,886 654,956 660,1024 L 744,1024 C 728,954 708,888 674,830 Z"
          fill="#a9b7c2" opacity="0.48"/>

    <!-- Right shoulder bright rim highlight -->
    <path d="M 664,804 C 718,824 758,864 792,924 C 810,956 824,990 838,1024"
          fill="none" stroke="#f6fafc" stroke-width="14" stroke-linecap="round" opacity="0.82"/>
    <!-- Crisp right shoulder outer outline -->
    <path d="M 638,794 C 700,806 752,844 788,900 C 810,936 828,978 846,1024"
          fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round"/>

    <!-- Inner dark grey undershirt / V-neck area -->
    <path d="M 332,930 L 505,895 L 650,945 L 655,1024 L 340,1024 Z"
          fill="url(#innerShirtGrad)"/>

    <!-- Inner shirt center placket / fold details -->
    <path d="M 438,974 C 456,954 478,950 500,958" fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round"/>
    <path d="M 456,996 C 472,980 488,976 504,984" fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round"/>
    <path d="M 490,942 L 494,1024" fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round"/>
    <path d="M 548,938 L 512,1024" fill="none" stroke="#141414" stroke-width="10" stroke-linecap="round"/>
    <path d="M 556,974 L 532,1024" fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round"/>

    <!-- Left shoulder outer light trim -->
    <path d="M 0,900 C 52,828 126,780 228,740 L 296,1024 L 0,1024 Z"
          fill="#c4cfd6" stroke="#141414" stroke-width="12" stroke-linejoin="round"/>

    <!-- Left sleeve brown-grey inner panel -->
    <path d="M 0,922 C 36,866 84,834 134,836 C 174,838 208,872 230,932 C 244,968 252,998 256,1024 L 0,1024 Z"
          fill="url(#sleeveGrad)" stroke="#141414" stroke-width="9" stroke-linejoin="round"/>

    <!-- Left sleeve top subtle highlight curve -->
    <path d="M 8,910 C 46,858 92,830 140,832 C 174,834 204,864 226,916"
          fill="none" stroke="#dce5eb" stroke-width="9" stroke-linecap="round" opacity="0.82"/>

    <!-- Neck -->
    <path d="M 314,680 L 584,788 L 570,895 L 496,955 L 330,785 Z"
          fill="url(#neckGrad)" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>

    <!-- Deep curved chin shadow on neck -->
    <path d="M 326,706 C 392,772 486,804 574,798 C 556,826 520,842 478,844 C 414,846 364,810 330,758 Z"
          fill="#a88470" opacity="0.65"/>

    <!-- Left Backpack Strap -->
    <path d="M 102,796 C 150,770 194,754 240,740 C 284,824 320,922 346,1024 L 260,1024 C 242,942 216,872 176,826 C 150,804 126,796 102,796 Z"
          fill="#141414" stroke="#0d0d0d" stroke-width="10" stroke-linejoin="round"/>

    <!-- Backpack strap ribbed texture lines -->
    <g stroke="#454541" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M 164,780 L 218,764"/>
      <path d="M 182,796 L 232,780"/>
      <path d="M 196,812 L 244,796"/>
      <path d="M 210,830 L 256,814"/>
      <path d="M 222,848 L 268,833"/>
      <path d="M 232,868 L 278,853"/>
      <path d="M 242,888 L 288,874"/>
      <path d="M 250,908 L 298,894"/>
      <path d="M 258,928 L 306,915"/>
      <path d="M 266,948 L 314,936"/>
      <path d="M 272,968 L 322,957"/>
      <path d="M 278,988 L 328,978"/>
      <path d="M 284,1008 L 334,999"/>
    </g>
    <!-- Strap outer light edge piping -->
    <path d="M 118,793 C 156,778 188,772 218,764" fill="none" stroke="#5c5c58" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Shirt Collar Flap -->
    <path d="M 236,734 C 248,706 276,686 308,684 C 334,768 394,854 496,928 L 352,1024 C 316,914 282,812 236,734 Z"
          fill="url(#shirtLightGrad)" stroke="#141414" stroke-width="12" stroke-linejoin="round"/>

    <!-- Subtle inner fold highlight on left collar -->
    <path d="M 254,732 C 268,710 284,700 302,698 C 322,764 374,846 474,922"
          fill="none" stroke="#e6eef2" stroke-width="6" stroke-linecap="round" opacity="0.65"/>

    <!-- Right Shirt Collar Flap -->
    <path d="M 584,792 C 612,846 634,916 648,982 L 560,928 L 502,962 L 500,928 C 538,884 568,838 584,792 Z"
          fill="url(#shirtLightGrad)" stroke="#141414" stroke-width="12" stroke-linejoin="round"/>

    <!-- Right collar outer seam extending cleanly to bottom -->
    <path d="M 638,966 L 648,1024" fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- 4. HEAD, FACE & EAR -->
  <g id="head">
    <!-- Main Face Shape -->
    <path d="M 314,476 C 310,552 308,616 322,664 C 344,732 422,786 534,794 C 646,802 726,754 744,678 C 756,626 752,542 746,456 C 740,368 722,290 660,256 C 570,210 420,230 356,308 C 320,352 316,416 314,476 Z"
          fill="url(#skinGrad)" stroke="#141414" stroke-width="14" stroke-linejoin="round"/>

    <!-- Soft jaw/chin underside shading inside face -->
    <path d="M 332,672 C 368,744 452,784 558,786 C 646,788 708,748 730,686 C 708,732 648,766 560,766 C 460,766 378,730 332,672 Z"
          fill="#c49c88" opacity="0.45"/>

    <!-- Ear -->
    <path d="M 312,504 C 284,474 242,468 220,492 C 200,514 202,568 222,606 C 242,642 276,658 314,648"
          fill="#e6c4b1" stroke="#141414" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Ear inner shadow tint -->
    <path d="M 294,518 C 266,494 236,502 226,530 C 218,556 232,604 268,620 C 288,628 302,620 308,608 Z"
          fill="#c9a38f" opacity="0.45"/>
    <!-- Ear inner helix & tragus lines -->
    <path d="M 232,546 C 228,518 250,502 272,516 C 284,524 288,542 278,554"
          fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round"/>
    <path d="M 256,576 C 272,566 286,574 294,598"
          fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round"/>
    <path d="M 244,586 C 248,600 258,610 272,612"
          fill="none" stroke="#141414" stroke-width="9" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M 436,422 C 464,412 494,411 520,415"
          fill="none" stroke="#141414" stroke-width="17" stroke-linecap="round"/>
    <path d="M 664,424 C 686,430 706,440 722,452"
          fill="none" stroke="#141414" stroke-width="17" stroke-linecap="round"/>

    <!-- Eyes (solid rounded vertical capsules) -->
    <rect x="457" y="462" width="32" height="111" rx="16" ry="16" fill="#0e0e0e"/>
    <rect x="662" y="470" width="31" height="106" rx="15.5" ry="15.5" fill="#0e0e0e"/>

    <!-- Mouth (gentle confident smile) -->
    <path d="M 526,678 C 562,686 598,689 628,685"
          fill="none" stroke="#141414" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- 5. HAIR -->
  <g id="hair">
    <!-- Top-right crown highlight tab (visible pale rim above hair) -->
    <path d="M 472,144 C 526,138 584,148 626,174 L 616,192 C 574,168 524,158 472,162 Z"
          fill="#e2ebd8" stroke="#161616" stroke-width="10" stroke-linejoin="round"/>

    <!-- Top-left hair rim highlight arc (visible pale rim above hair) -->
    <path d="M 254,244 C 312,182 378,150 450,148 L 446,166 C 384,168 324,198 268,256 Z"
          fill="#eaf1e2" stroke="#161616" stroke-width="9" stroke-linejoin="round"/>

    <!-- Main Hair Mass with exact bang tufts & sideburn -->
    <path d="M 218,484
             C 198,426 196,356 214,302
             C 234,244 294,198 366,174
             C 438,152 522,156 592,182
             C 662,208 716,254 742,308
             C 750,324 750,342 742,356
             C 746,386 748,420 746,458
             L 734,442
             C 730,402 720,360 704,330
             L 708,354
             C 694,334 676,308 656,288
             C 656,318 650,344 636,358
             C 620,336 602,302 582,272
             C 548,308 510,344 470,364
             C 472,332 474,302 470,276
             C 452,298 432,318 412,328
             L 404,316
             C 402,344 398,368 392,386
             L 346,396
             C 336,422 330,456 328,492
             L 322,556
             C 312,534 308,510 308,488
             C 282,468 242,466 218,484 Z"
          fill="url(#hairGrad)" stroke="#111111" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Subtle hair texture / sheen strokes inside hair -->
    <g stroke="#3d3d3a" stroke-width="5" stroke-linecap="round" opacity="0.75">
      <path d="M 262,286 L 274,264"/>
      <path d="M 302,316 L 314,290"/>
      <path d="M 346,246 L 366,226"/>
      <path d="M 398,224 L 424,206"/>
      <path d="M 480,224 L 502,210"/>
      <path d="M 526,306 L 548,280"/>
      <path d="M 244,368 L 250,342"/>
      <path d="M 624,256 L 642,272"/>
    </g>
  </g>

  <!-- 6. GLASSES (Foreground) -->
  <g id="glasses">
    <!-- Left Temple Arm -->
    <path d="M 302,487 L 392,482 L 394,499 L 304,504 Z"
          fill="#edf2f4" stroke="#181818" stroke-width="9" stroke-linejoin="round"/>

    <!-- Bridge connecting left & right frames -->
    <path d="M 562,499 C 580,484 606,484 624,499 L 622,516 C 606,502 580,502 564,516 Z"
          fill="#edf2f4" stroke="#181818" stroke-width="9" stroke-linejoin="round"/>

    <!-- Left Lens (rounded squircle) -->
    <path d="M 394,516
             C 394,466 422,446 478,446
             C 536,446 566,468 566,518
             C 566,574 532,606 478,606
             C 424,606 394,572 394,516 Z"
          fill="url(#lensGrad)" stroke="#1a1a1a" stroke-width="11.5" stroke-linejoin="round"/>

    <!-- Left Lens subtle top-left glossy highlight arc -->
    <path d="M 412,484 C 424,464 452,456 486,458"
          fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Right Lens (rounded squircle, slightly foreshortened) -->
    <path d="M 620,528
             C 620,478 646,460 702,460
             C 758,460 788,484 788,534
             C 788,586 756,620 704,620
             C 650,620 620,584 620,528 Z"
          fill="url(#lensGrad)" stroke="#1a1a1a" stroke-width="11.5" stroke-linejoin="round"/>

    <!-- Right Lens subtle top-left glossy highlight arc -->
    <path d="M 640,496 C 654,476 680,470 714,472"
          fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" opacity="0.55"/>

    <!-- Right Lens inner temple-arm perspective detail -->
    <path d="M 744,532 L 786,514"
          fill="none" stroke="#1a1a1a" stroke-width="9.5" stroke-linecap="round"/>

    <!-- Right Lens outer hinge nub -->
    <path d="M 786,513 L 800,511"
          fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>